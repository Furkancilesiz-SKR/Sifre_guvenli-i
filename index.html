<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkan | Siber Güvenlik Paneli</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-cyan: #00f2ff;
            --accent-green: #238636;
            --accent-yellow: #d29922;
            --accent-red: #da3633;
            --gray: #8b949e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid #30363d;
        }

        h1 {
            text-align: center;
            color: var(--accent-cyan);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--accent-cyan);
        }

        /* Güç Barı */
        .progress-container {
            height: 10px;
            background: #30363d;
            border-radius: 5px;
            margin: 1rem 0;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            transition: width 0.4s, background-color 0.4s;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray);
        }

        .check-item.valid {
            color: var(--accent-green);
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #010409;
            border-radius: 6px;
            border-left: 4px solid var(--gray);
        }

        .brute-force {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 1rem;
            text-align: center;
            border-top: 1px solid #30363d;
            padding-top: 1rem;
        }

        #time-result {
            color: var(--accent-cyan);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ KALKAN ANALYZER</h1>
    
    <div class="input-group">
        <input type="password" id="passwordInput" placeholder="Analiz edilecek şifreyi giriniz..." autocomplete="off">
    </div>

    <div id="score-text" style="font-weight: bold; text-align: center;">Skor: %0</div>
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="stats" id="checklist">
        <div class="check-item" data-rule="len8">✘ 8+ Karakter</div>
        <div class="check-item" data-rule="len12">✘ 12+ Karakter</div>
        <div class="check-item" data-rule="upper">✘ Büyük Harf</div>
        <div class="check-item" data-rule="lower">✘ Küçük Harf</div>
        <div class="check-item" data-rule="number">✘ Rakam</div>
        <div class="check-item" data-rule="special">✘ Özel Karakter</div>
    </div>

    <div class="result-box" id="feedback">
        Şifre bekleniyor...
    </div>

    <div class="brute-force">
        Tahmini Kırılma Süresi: <span id="time-result">-</span><br>
        <small>(1 Milyar Deneme / Saniye)</small>
    </div>
</div>

<script>
    const input = document.getElementById('passwordInput');
    const bar = document.getElementById('progress-bar');
    const scoreText = document.getElementById('score-text');
    const feedback = document.getElementById('feedback');
    const timeResult = document.getElementById('time-result');

    input.addEventListener('input', () => {
        const val = input.value;
        let score = 0;
        let charset = 0;

        const rules = {
            len8: val.length >= 8,
            len12: val.length >= 12,
            upper: /[A-Z]/.test(val),
            lower: /[a-z]/.test(val),
            number: /[0-9]/.test(val),
            special: /[!@#$%^&*(),.?":{}|<>_\-+=\[\]/\\~`';]/.test(val)
        };

        // Skor Hesaplama (Python ağırlıklarıyla aynı)
        if (rules.len8) score += 18;
        if (rules.len12) score += 10;
        if (rules.upper) { score += 18; charset += 26; }
        if (rules.lower) { score += 18; charset += 26; }
        if (rules.number) { score += 18; charset += 10; }
        if (rules.special) { score += 18; charset += 32; }

        score = Math.min(score, 100);

        // Arayüz Güncelleme
        updateUI(score, rules, val.length, charset);
    });

    function updateUI(score, rules, length, charset) {
        // Bar genişliği ve rengi
        bar.style.width = score + "%";
        let color = '#da3633';
        let label = 'ÇOK ZAYIF';

        if (score >= 40) { color = '#d29922'; label = 'ORTA'; }
        if (score >= 70) { color = '#238636'; label = 'GÜÇLÜ'; }
        if (score >= 100) { color = '#00f2ff'; label = 'MÜKEMMEL'; }

        bar.style.backgroundColor = color;
        scoreText.style.color = color;
        scoreText.innerText = `Skor: %${score} [${label}]`;

        // Checklist güncelleme
        Object.keys(rules).forEach(rule => {
            const el = document.querySelector(`[data-rule="${rule}"]`);
            if (rules[rule]) {
                el.classList.add('valid');
                el.innerText = '✔ ' + el.innerText.substring(2);
            } else {
                el.classList.remove('valid');
                el.innerText = '✘ ' + el.innerText.substring(2);
            }
        });

        // Brute Force Hesaplama
        if (length > 0) {
            const combinations = Math.pow(charset || 1, length);
            const seconds = combinations / 1000000000;
            timeResult.innerText = formatTime(seconds);
            feedback.innerText = score < 60 ? "⚠ Bu şifre siber saldırılara karşı savunmasız!" : "✔ Şifreniz güvenli görünüyor.";
            feedback.style.borderLeftColor = color;
        } else {
            timeResult.innerText = "-";
            feedback.innerText = "Şifre bekleniyor...";
        }
    }

    function formatTime(seconds) {
        if (seconds < 1) return "< 1 saniye";
        if (seconds < 60) return seconds.toFixed(1) + " saniye";
        if (seconds < 3600) return (seconds / 60).toFixed(1) + " dakika";
        if (seconds < 86400) return (seconds / 3600).toFixed(1) + " saat";
        if (seconds < 31536000) return (seconds / 86400).toFixed(1) + " gün";
        if (seconds < 31536000000) return (seconds / 31536000).toFixed(1) + " yıl";
        return "Milyarlarca yıl";
    }
</script>

</body>
</html>
